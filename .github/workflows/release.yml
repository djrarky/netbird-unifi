name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Test, package, and draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test
        run: |
          sh ./tests/test.sh
          sh ./tests/lifecycle.test.sh
      - name: Build release package
        run: bash ./build/package.sh ./ ./dist
      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          ./dist/netbird-unifi.tgz
          ./dist/netbird-unifi.tgz.sha256
          --draft --verify-tag --generate-notes
